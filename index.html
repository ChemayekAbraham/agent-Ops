    <!-- Domain handling: the app is served directly on every custom domain
         (welileapp.com, welilereceipts.com, www.*). We intentionally do NOT legacy-domain-guard-allow
         run a client-side cross-domain redirect here: bouncing a freshly
         opened welilereceipts.com link to welileapp.com triggers Chrome's legacy-domain-guard-allow
         "Did you mean welilereceipts.com?" lookalike interstitial (on legacy-domain-guard-allow
         about:blank) inside in-app browsers. Canonicalization for SEO is
         handled by the <link rel="canonical"> tag below, not by redirecting.

         welile.tech is the one exception: it's fully retired (see legacy-domain-guard-allow
         mem/constraints/canonical-domain.md) but its DNS still resolves here, legacy-domain-guard-allow
         so old links/bookmarks still load the live app on it — including a
         broken Google/Apple sign-in, since that host was never registered as
         an OAuth callback target. Unlike welilereceipts.com, welile.tech has legacy-domain-guard-allow
         no character-level resemblance to welileapp.com under a different
         TLD, so it doesn't trip Chrome's lookalike-domain interstitial and a
         client-side redirect is safe here. Runs before every other script so
         a welile.tech visitor never boots the app on the dead host. legacy-domain-guard-allow -->
    <script>
      (function () {
        if (/(^|\.)welile\.tech$/i.test(window.location.hostname)) { // legacy-domain-guard-allow
          window.location.replace('https://welileapp.com' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!--
      Out-of-date browser banner. Lightweight, dependency-free, and written in
      ES5 so it runs on very old engines. It targets phones so old they can't
      render the app even after runtime polyfills. Three signals trigger it:
        1) the module script never runs (no ES-module support) — <script nomodule>
        2) a critical runtime capability is missing (Promise/fetch/Map/etc.)
        3) React never mounts within the watchdog window (hard crash on old JS)
      The banner is dismissible and non-blocking so it never traps a healthy
      session behind a false positive on a slow network.
    -->
    <script nomodule>
      (function () { try { window.__WELILE_NO_MODULES__ = true; } catch (e) {} })();
    </script>
    <script>
      (function () {
        var DISMISS_KEY = 'welile-outdated-dismissed';
        var CHOICE_KEY = 'welile-outdated-choices';
        var shown = false;
        function dismissed() {
          try { return localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
        }
        // Queue the user's banner interaction in localStorage. The app bundle
        // drains this into browser_compat_events once it boots (the banner runs
        // before the bundle and can't reach the backend itself).
        function recordChoice(choice) {
          try {
            var raw = null;
            try { raw = localStorage.getItem(CHOICE_KEY); } catch (e) {}
            var arr = [];
            if (raw) { try { arr = JSON.parse(raw) || []; } catch (e) { arr = []; } }
            if (!arr || typeof arr.length !== 'number') arr = [];
            arr.push({ choice: choice, ts: new Date().toISOString(), ua: navigator.userAgent || null });
            if (arr.length > 20) arr = arr.slice(arr.length - 20);
            try { localStorage.setItem(CHOICE_KEY, JSON.stringify(arr)); } catch (e) {}
            try { window.__welileBannerChoice = choice; } catch (e) {}
          } catch (e) {}
        }
        // Try to reopen the current page in real Chrome. On Android in-app
        // browsers this uses an intent:// URL; on iOS the googlechrome:// scheme.
        // Falls back to the store listing when neither is available.
        function openInChrome() {
          var ua = navigator.userAgent || '';
          var href = window.location.href;
          try {
            if (/Android/.test(ua)) {
              var noScheme = href.replace(/^https?:\/\//, '');
              window.location.href =
                'intent://' + noScheme + '#Intent;scheme=https;package=com.android.chrome;end';
              return;
            }
            if (/iPhone|iPad|iPod/.test(ua)) {
              window.location.href = href.replace(/^https?:\/\//, 'googlechrome://');
              return;
            }
          } catch (e) {}
          try {
            window.open(
              /iPhone|iPad|iPod/.test(ua)
                ? 'https://apps.apple.com/app/id535886823'
                : 'https://play.google.com/store/apps/details?id=com.android.chrome',
              '_blank'
            );
          } catch (e) {}
        }
        function showBanner() {
          if (shown || dismissed()) return;
          if (document.getElementById('welile-outdated-banner')) return;
          shown = true;
          recordChoice('shown');
          var ua = navigator.userAgent || '';
          var isIOS = /iPhone|iPad|iPod/.test(ua);
          var isInApp =
            /; wv\)/.test(ua) ||
            /\bFB_IAB\b|FBAN|FBAV|Instagram|WhatsApp|Line|Twitter|MicroMessenger|GSA/.test(ua);
          var bar = document.createElement('div');
          bar.id = 'welile-outdated-banner';
          bar.setAttribute('role', 'alert');
          bar.style.cssText =
            'position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#7c3aed;color:#fff;' +
            'font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;' +
            'padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.25);' +
            'display:flex;align-items:center;gap:10px;flex-wrap:wrap';
          var msg = document.createElement('div');
          msg.style.cssText = 'flex:1 1 220px;min-width:180px';
          // Tailor the headline + the one concrete next step to the environment.
          var headline = isInApp ? 'Open Welile in your browser' : 'Your browser is out of date';
          var nextStep = isInApp
            ? (isIOS
                ? 'You\u2019re in an in-app browser (like WhatsApp). Tap the \u2022\u2022\u2022 menu and choose \u201cOpen in Safari\u201d, or tap <strong>Open in Chrome</strong> below.'
                : 'You\u2019re in an in-app browser (like WhatsApp). Tap the \u22ee menu (top-right) and choose \u201cOpen in browser\u201d, or tap <strong>Open in Chrome</strong> below.')
            : 'Welile may not load correctly. Tap <strong>Open in Chrome</strong>, update your browser, or tap Reload once updated.';
          msg.innerHTML =
            '<strong style="display:block;font-weight:600">' + headline + '</strong>' +
            '<span style="opacity:.92">' + nextStep + '</span>';
          // Supported-browsers section: concrete minimum versions plus direct
          // one-tap update links for Chrome and Android System WebView.
          var supported = document.createElement('div');
          supported.style.cssText =
            'flex:1 1 100%;margin-top:4px;padding-top:8px;border-top:1px solid rgba(255,255,255,.25);' +
            'font-size:12px;line-height:1.5;opacity:.95';
          supported.innerHTML =
            '<strong style="display:block;font-weight:600;margin-bottom:2px">Supported browsers</strong>' +
            '<span style="display:block">Chrome 90+ &middot; Android System WebView 90+ &middot; Safari / iOS 14+ &middot; ' +
            'Samsung Internet 14+ &middot; Firefox 90+ &middot; Edge 90+</span>' +
            '<span style="display:block;margin-top:6px">Update now: ' +
            '<a href="https://play.google.com/store/apps/details?id=com.android.chrome" target="_blank" rel="noopener" ' +
            'style="color:#fff;font-weight:600;text-decoration:underline">Chrome</a> &middot; ' +
            '<a href="https://play.google.com/store/apps/details?id=com.google.android.webview" target="_blank" rel="noopener" ' +
            'style="color:#fff;font-weight:600;text-decoration:underline">Android System WebView</a> &middot; ' +
            '<a href="https://apps.apple.com/app/id535886823" target="_blank" rel="noopener" ' +
            'style="color:#fff;font-weight:600;text-decoration:underline">Chrome for iOS</a></span>';
          var actions = document.createElement('div');
          actions.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap';
          // Primary CTA: Open in Chrome (the single clearest next step).
          var openChrome = document.createElement('button');
          openChrome.type = 'button';
          openChrome.textContent = 'Open in Chrome';
          openChrome.style.cssText =
            'background:#fff;color:#5b21b6;border:0;border-radius:6px;padding:8px 12px;' +
            'font-weight:700;font-size:13px;cursor:pointer;min-height:36px';
          openChrome.onclick = function () { recordChoice('open_chrome'); openInChrome(); };
          var reload = document.createElement('button');
          reload.type = 'button';
          reload.textContent = 'Reload';
          reload.style.cssText =
            'background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55);' +
            'border-radius:6px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;min-height:36px';
          reload.onclick = function () { recordChoice('reload'); window.location.reload(); };
          // In-app browsers get an explicit "How to switch" helper toggle.
          var howto = null;
          if (isInApp) {
            howto = document.createElement('button');
            howto.type = 'button';
            howto.textContent = 'How to switch';
            howto.style.cssText =
              'background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);' +
              'border-radius:6px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;min-height:36px';
          }
          var close = document.createElement('button');
          close.type = 'button';
          close.setAttribute('aria-label', 'Dismiss');
          close.textContent = '\u00D7';
          close.style.cssText =
            'background:transparent;color:#fff;border:0;font-size:20px;line-height:1;' +
            'cursor:pointer;padding:4px 8px;min-height:36px';
          close.onclick = function () {
            recordChoice('dismiss');
            try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
            if (bar.parentNode) bar.parentNode.removeChild(bar);
          };
          // Step-by-step "switch browser" instructions for in-app surfaces,
          // hidden until the user taps "How to switch".
          var steps = null;
          if (isInApp) {
            steps = document.createElement('div');
            steps.style.cssText =
              'flex:1 1 100%;margin-top:4px;padding-top:8px;border-top:1px solid rgba(255,255,255,.25);' +
              'font-size:12px;line-height:1.6;opacity:.95;display:none';
            steps.innerHTML = isIOS
              ? '<strong style="display:block;font-weight:600;margin-bottom:2px">Switch to Safari or Chrome</strong>' +
                '1. Tap the <strong>\u2022\u2022\u2022</strong> (or share) icon.<br>' +
                '2. Choose <strong>Open in Safari</strong> or <strong>Open in Chrome</strong>.<br>' +
                '3. Welile will load normally there.'
              : '<strong style="display:block;font-weight:600;margin-bottom:2px">Switch to your browser</strong>' +
                '1. Tap the <strong>\u22ee</strong> menu (top-right corner).<br>' +
                '2. Choose <strong>Open in browser</strong> (or <strong>Open in Chrome</strong>).<br>' +
                '3. Welile will load normally there.';
            howto.onclick = function () {
              recordChoice('switch_browser');
              steps.style.display = steps.style.display === 'none' ? 'block' : 'none';
            };
          }
          actions.appendChild(openChrome);
          actions.appendChild(reload);
          if (howto) actions.appendChild(howto);
          actions.appendChild(close);
          bar.appendChild(msg);
          bar.appendChild(actions);
          if (steps) bar.appendChild(steps);
          bar.appendChild(supported);
          (document.body || document.documentElement).appendChild(bar);
        }
        try { window.__welileShowOutdatedBanner = showBanner; } catch (e) {}

        // 1) No ES-module support: the app's module script never executes.
        if (window.__WELILE_NO_MODULES__) { showBanner(); return; }

        // 2) Critical runtime capabilities missing (not polyfillable enough to run).
        var ok = !!(window.Promise && window.fetch && window.Map && window.Set &&
          window.Symbol && Array.from && Object.assign && window.WeakMap);
        if (!ok) { showBanner(); return; }

        // 2.5) PROACTIVE old-WebView / old-Chrome detection. Show the banner
        //      BEFORE the app crashes to a blank screen. Many budget Android
        //      phones (Tecno, Infinix, itel) ship an outdated Android System
        //      WebView that renders the app inside in-app browsers
        //      (WhatsApp/Facebook). We parse the Chromium version from the UA
        //      and warn when it's below our supported floor (Chrome 90+).
        //      Only fires for Chromium-based engines we can version-parse, so
        //      modern phones and non-Chromium browsers are never false-flagged.
        try {
          var ua = navigator.userAgent || '';
          var MIN_CHROMIUM = 90;
          var cm = ua.match(/Chrome\/(\d+)/);
          if (cm) {
            var chromeVer = parseInt(cm[1], 10);
            // "; wv" marks an Android System WebView; also treat known in-app
            // browsers (Facebook/Instagram) as WebView-class surfaces.
            var isWebView = /; wv\)/.test(ua) || /\bFB_IAB\b|FBAN|FBAV|Instagram/.test(ua);
            var isAndroid = /Android/.test(ua);
            if (chromeVer && chromeVer < MIN_CHROMIUM && (isWebView || isAndroid)) {
              showBanner();
              return;
            }
          }
        } catch (e) {}

        // 3) Hard-crash watchdog: if React never sets the ready flag, the app
        //    likely threw on old-engine JS. 18s is generous for slow 2G/3G so a
        //    healthy-but-slow load is not flagged.
        setTimeout(function () {
          if (!window.__WELILE_APP_READY__ && !dismissed()) showBanner();
        }, 18000);
      })();
    </script>
    <!-- Capture the browser install signal before the app bundle loads.
         Chrome fires `beforeinstallprompt` once, very early; if nothing is
         listening at that moment the event is lost for the whole visit and the
         install card can never offer a one-tap install. -->
    <script>
      (function () {
        try {
          window.__welileInstallPrompt = window.__welileInstallPrompt || null;
          window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__welileInstallPrompt = e;
            try {
              window.dispatchEvent(new Event('welile:installpromptready'));
            } catch (err) {}
          });
          window.addEventListener('appinstalled', function () {
            window.__welileInstallPrompt = null;
          });
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
