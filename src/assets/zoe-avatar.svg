<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Zoe — Welile My Space Staff Assistant">
  <defs>
    <linearGradient id="zoeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="zoeBlazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <clipPath id="zoeCircle">
      <circle cx="64" cy="64" r="60" />
    </clipPath>
  </defs>

  <!-- Outer soft ring -->
  <circle cx="64" cy="64" r="62" fill="#e2e8f0" />
  <circle cx="64" cy="64" r="60" fill="url(#zoeBg)" />

  <g clip-path="url(#zoeCircle)">
    <!-- Subtle ambient glow -->
    <circle cx="96" cy="28" r="34" fill="#2dd4bf" opacity="0.18" />

    <!-- Hair back (braided/styled crown bun) -->
    <circle cx="64" cy="24" r="14" fill="#18181b" />
    <ellipse cx="64" cy="48" rx="26" ry="25" fill="#18181b" />

    <!-- Neck & shoulders -->
    <path d="M54 74 h20 v18 h-20 z" fill="#7c4a2d" />
    <path d="M54 78 q10 6 20 0 v6 h-20 z" fill="#633921" opacity="0.45" />

    <!-- Crisp white office blouse & collar -->
    <path d="M24 128 C26 95, 44 86, 64 86 C84 86, 102 95, 104 128 Z" fill="#f8fafc" />

    <!-- Tailored office blazer -->
    <path d="M20 128 C22 94, 40 85, 53 85 L64 110 L75 85 C88 85, 106 94, 108 128 Z" fill="url(#zoeBlazer)" />
    <!-- Blazer lapels -->
    <path d="M53 85 L64 110 L46 105 Z" fill="#334155" />
    <path d="M75 85 L64 110 L82 105 Z" fill="#334155" />
    <!-- Subtle teal lapel pin -->
    <circle cx="79" cy="100" r="2.6" fill="#2dd4bf" />

    <!-- Ears & pearl studs -->
    <circle cx="40" cy="56" r="5" fill="#7c4a2d" />
    <circle cx="88" cy="56" r="5" fill="#7c4a2d" />
    <circle cx="39.5" cy="59.5" r="1.8" fill="#f8fafc" />
    <circle cx="88.5" cy="59.5" r="1.8" fill="#f8fafc" />

    <!-- Face -->
    <path d="M42 46 C42 32, 86 32, 86 46 C86 67, 76 79, 64 79 C52 79, 42 67, 42 46 Z" fill="#8b5436" />

    <!-- Hair front sweep -->
    <path d="M40 48 C41 31, 53 26, 64 26 C75 26, 87 31, 88 48 C83 38, 74 35, 64 35 C54 35, 45 38, 40 48 Z" fill="#18181b" />

    <!-- Eyebrows -->
    <path d="M48 47 Q54 44.5 59 46.5" fill="none" stroke="#18181b" stroke-width="2.2" stroke-linecap="round" />
    <path d="M69 46.5 Q74 44.5 80 47" fill="none" stroke="#18181b" stroke-width="2.2" stroke-linecap="round" />

    <!-- Eyes -->
    <circle cx="53.5" cy="53" r="2.7" fill="#0f172a" />
    <circle cx="74.5" cy="53" r="2.7" fill="#0f172a" />
    <circle cx="54.4" cy="52.1" r="0.9" fill="#ffffff" />
    <circle cx="75.4" cy="52.1" r="0.9" fill="#ffffff" />

    <!-- Modern professional eyeglasses -->
    <rect x="45.5" y="47.5" width="16" height="11" rx="4" fill="#ffffff" fill-opacity="0.1" stroke="#fbbf24" stroke-width="2" />
    <rect x="66.5" y="47.5" width="16" height="11" rx="4" fill="#ffffff" fill-opacity="0.1" stroke="#fbbf24" stroke-width="2" />
    <path d="M61.5 52.5 L66.5 52.5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M64 53 L62.5 60.5 Q64 62 65.5 60.5" fill="none" stroke="#633921" stroke-width="1.8" stroke-linecap="round" />

    <!-- Warm, composed smile -->
    <path d="M55.5 66 Q64 72.5 72.5 66" fill="none" stroke="#451a03" stroke-width="2.4" stroke-linecap="round" />
    <path d="M57.5 66.8 Q64 70.8 70.5 66.8" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>
