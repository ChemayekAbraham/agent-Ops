<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Welile Platform Architecture</title>
  <style>
    :root {
      --bg-space: #060b17;
      --bg-panel: rgba(8, 16, 34, 0.92);
      --cyan-glow: #00d2ff;
      --cyan-bright: #38bdf8;
      --cyan-deep: #0284c7;
      --purple-glow: #c084fc;
      --purple-neon: #a855f7;
      --purple-deep: #7c3aed;
      --magenta-glow: #f43f5e;
      --magenta-bright: #fb7185;
      --orange-glow: #f97316;
      --orange-bright: #fb923c;
      --emerald-glow: #10b981;
      --amber-glow: #f59e0b;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-hud: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --font-mono: "SF Mono", Menlo, Consolas, Monaco, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-space);
      color: var(--text-white);
      font-family: var(--font-hud);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top HUD Navigation Bar */
    header {
      background: rgba(6, 11, 23, 0.96);
      border-bottom: 1px solid rgba(0, 210, 255, 0.28);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.85), 0 0 16px rgba(0, 210, 255, 0.12);
      padding: 0.5rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      z-index: 100;
      backdrop-filter: blur(12px);
      flex-wrap: nowrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .hud-badge-icon {
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--cyan-glow);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 210, 255, 0.12);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.35);
    }

    .header-titles {
      display: flex;
      flex-direction: column;
    }

    .header-title {
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff 0%, #38bdf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 18px rgba(0, 210, 255, 0.4);
    }

    .header-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Handover Chapters Navigation Pills */
    .handover-nav-pills {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      padding: 0.1rem 0;
    }

    .doc-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 210, 255, 0.25);
      color: #94a3b8;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .doc-pill:hover {
      background: rgba(0, 210, 255, 0.2);
      border-color: var(--cyan-glow);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    .doc-pill.urgent {
      border-color: rgba(244, 63, 94, 0.5);
      color: #fb7185;
    }

    .doc-pill.urgent:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--magenta-glow);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .sim-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-bright);
      font-family: var(--font-hud);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.32rem 0.75rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
      white-space: nowrap;
    }

    .sim-btn:hover {
      background: var(--cyan-glow);
      color: #030712;
      box-shadow: 0 0 16px rgba(0, 210, 255, 0.6);
    }

    .sim-btn.active {
      background: var(--magenta-glow);
      border-color: var(--magenta-bright);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(244, 63, 94, 0.7);
    }

    .mode-toggle {
      display: flex;
      background: rgba(15, 23, 42, 0.9);
      padding: 0.2rem;
      border-radius: 6px;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-hud);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.3rem 0.65rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .mode-btn:hover {
      color: #ffffff;
    }

    .mode-btn.active {
      background: var(--cyan-glow);
      color: #030712;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.55);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 6px;
      padding: 0.3rem 0.6rem 0.3rem 1.7rem;
      color: #f8fafc;
      font-size: 0.72rem;
      font-family: var(--font-hud);
      outline: none;
      width: 170px;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.35);
      width: 220px;
    }

    .search-icon {
      position: absolute;
      left: 0.5rem;
      pointer-events: none;
      stroke: var(--text-muted);
    }

    /* Simulation Scrubber Banner */
    #sim-banner {
      display: none;
      background: rgba(10, 20, 42, 0.96);
      border-bottom: 1px solid var(--cyan-glow);
      padding: 0.35rem 1.25rem;
      font-size: 0.74rem;
      color: var(--cyan-bright);
      font-family: var(--font-mono);
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px rgba(0, 210, 255, 0.25);
      z-index: 99;
    }

    #sim-banner.visible {
      display: flex;
    }

    /* Viewport Container */
    #viewport-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: radial-gradient(circle at 60% 45%, #0f1c3d 0%, #081124 50%, #040813 90%);
    }

    #viewport-container:active {
      cursor: grabbing;
    }

    #architecture-canvas {
      width: 100%;
      height: 100%;
      display: block;
      transform-origin: 0 0;
    }

    /* Laser Conduit Glows & Stream Animations */
    .laser-cyan {
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.85));
    }
    .laser-magenta {
      filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.9));
    }
    .laser-orange {
      filter: drop-shadow(0 0 9px rgba(249, 115, 22, 0.85));
    }
    .laser-purple {
      filter: drop-shadow(0 0 9px rgba(192, 132, 252, 0.9));
    }

    @keyframes dashStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes dashStreamFast {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes brainOrbital {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes brainPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(192, 132, 252, 0.65)); }
      50% { transform: scale(1.02); filter: drop-shadow(0 0 28px rgba(0, 210, 255, 0.85)) drop-shadow(0 0 18px rgba(192, 132, 252, 0.9)); }
    }

    .pulse-stream-cyan {
      stroke-dasharray: 8, 10;
      animation: dashStream 1.8s linear infinite;
    }

    .pulse-stream-magenta {
      stroke-dasharray: 10, 12;
      animation: dashStreamFast 1.2s linear infinite;
    }

    .pulse-stream-orange {
      stroke-dasharray: 10, 12;
      animation: dashStreamFast 1.3s linear infinite;
    }

    .brain-anim-core {
      animation: brainPulse 3.8s ease-in-out infinite;
      transform-origin: 950px 490px;
    }

    .orbit-ring {
      animation: brainOrbital 24s linear infinite;
      transform-origin: 950px 490px;
    }

    /* Node Hover Interactions */
    .arch-node {
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arch-node:hover .node-frame {
      filter: drop-shadow(0 0 14px currentColor);
      stroke-width: 2.4px !important;
    }

    .arch-node:hover text {
      text-shadow: 0 0 8px currentColor;
    }

    .arch-pill {
      cursor: pointer;
      transition: all 0.15s;
    }

    .arch-pill:hover rect {
      fill: rgba(0, 210, 255, 0.25) !important;
      stroke: #00d2ff !important;
      filter: drop-shadow(0 0 8px #00d2ff);
    }

    /* Floating Zoom Controls */
    .zoom-toolbar {
      position: absolute;
      bottom: 1.25rem;
      left: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      background: rgba(8, 16, 34, 0.92);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 0.35rem;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.7);
      z-index: 50;
    }

    .zoom-btn {
      width: 30px;
      height: 30px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #f1f5f9;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 800;
      transition: all 0.15s;
    }

    .zoom-btn:hover {
      background: rgba(0, 210, 255, 0.25);
      border-color: var(--cyan-glow);
      color: var(--cyan-glow);
    }

    /* Holographic Drawer */
    .hud-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 16, 0.78);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 200;
    }

    .hud-drawer-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .hud-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 620px;
      background: #070d1d;
      border-left: 1.5px solid var(--cyan-glow);
      box-shadow: -15px 0 45px rgba(0, 0, 0, 0.95), 0 0 35px rgba(0, 210, 255, 0.2);
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      z-index: 201;
      overflow: hidden;
    }

    .hud-drawer.active {
      transform: translateX(0);
    }

    .drawer-top {
      padding: 1.15rem 1.4rem;
      border-bottom: 1px solid rgba(0, 210, 255, 0.25);
      background: rgba(12, 22, 45, 0.85);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .drawer-badge {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 0.35rem;
    }

    .drawer-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.02em;
    }

    .drawer-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 0.2rem;
    }

    .drawer-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.2rem;
      transition: color 0.15s;
    }

    .drawer-close:hover {
      color: var(--cyan-glow);
    }

    .drawer-body {
      padding: 1.4rem;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .detail-card {
      background: rgba(12, 22, 45, 0.7);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 8px;
      padding: 1rem;
    }

    .detail-card.danger {
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(30, 10, 20, 0.7);
    }

    .detail-card.warning {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(30, 20, 10, 0.7);
    }

    .detail-card-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .code-box {
      background: #030712;
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 6px;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: #bae6fd;
      position: relative;
      overflow-x: auto;
      user-select: text;
      -webkit-user-select: text;
      line-height: 1.45;
    }

    .code-copy-btn {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: var(--cyan-bright);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .code-copy-btn:hover {
      background: var(--cyan-glow);
      color: #030712;
    }

    .handover-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--cyan-bright);
      font-weight: 700;
      font-size: 0.75rem;
      text-decoration: none;
      margin-top: 0.4rem;
    }
    .handover-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Top HUD Header -->
  <header>
    <div class="header-left">
      <div class="hud-badge-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="header-titles">
        <div id="main-header-title" class="header-title">WELILE PLATFORM ARCHITECTURE: External Rails to Double-Entry Ledger</div>
        <div id="main-header-sub" class="header-sub">Engineer Survival Blueprint &bull; 627,405 Ledger Rows &bull; 388 Edge Functions &bull; 22 Treasury Switches &bull; Verified 2026-09-28</div>
      </div>
    </div>

    <!-- Handover Chapters Direct Nav Pills -->
    <div class="handover-nav-pills">
      <button class="doc-pill" onclick="openHandoverDoc('01')">01 Access</button>
      <button class="doc-pill urgent" onclick="openHandoverDoc('02')">02 Danger Zones</button>
      <button class="doc-pill urgent" onclick="openHandoverDoc('03')">03 Invariants</button>
      <button class="doc-pill urgent" onclick="openHandoverDoc('04')">04 Runbooks</button>
      <button class="doc-pill" onclick="openHandoverDoc('05')">05 DR Recovery</button>
      <button class="doc-pill" onclick="openHandoverDoc('06')">06 Verification</button>
      <button class="doc-pill" onclick="openHandoverDoc('07')">07 Tribal Traps</button>
      <button class="doc-pill urgent" onclick="openHandoverDoc('08')">08 Known Gaps</button>
    </div>

    <div class="header-right">
      <button id="btn-simulate" class="sim-btn" onclick="toggleSimulation()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="sim-btn-text">Simulate Money Flow</span>
      </button>

      <div class="search-box">
        <svg class="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="node-search" class="search-input" placeholder="Search tables, RPCs, locks..." />
      </div>

    </div>
  </header>

  <!-- Live Simulation Scrubber Banner -->
  <div id="sim-banner">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00d2ff; box-shadow: 0 0 8px #00d2ff;"></span>
      <span id="sim-step-text">STEP 1 / 8: Tenant pays by MoMo / Airtel</span>
    </div>
    <div style="display: flex; gap: 0.5rem;">
      <button onclick="prevSimStep()" style="background: rgba(15,23,42,0.8); border: 1px solid #00d2ff; color: #fff; padding: 0.15rem 0.5rem; border-radius: 3px; cursor: pointer; font-size: 0.7rem;">&larr; Prev</button>
      <button onclick="nextSimStep()" style="background: rgba(0,210,255,0.2); border: 1px solid #00d2ff; color: #00d2ff; padding: 0.15rem 0.5rem; border-radius: 3px; cursor: pointer; font-size: 0.7rem; font-weight: 700;">Next &rarr;</button>
    </div>
  </div>

  <!-- Interactive Viewport Canvas -->
  <div id="viewport-container">
    <svg id="architecture-canvas" viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- PCB Circuit Grid Pattern -->
        <pattern id="pcb-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 210, 255, 0.035)" stroke-width="1"/>
          <circle cx="0" cy="0" r="1.5" fill="rgba(0, 210, 255, 0.15)"/>
        </pattern>

        <!-- Filters for High-Intensity Neon Glow -->
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="7" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Gradients -->
        <linearGradient id="grad-panel-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#071022" stop-opacity="0.95"/>
        </linearGradient>

        <linearGradient id="grad-panel-purple" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#080e22" stop-opacity="0.95"/>
        </linearGradient>

        <linearGradient id="grad-panel-orange" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#081022" stop-opacity="0.95"/>
        </linearGradient>

        <linearGradient id="grad-cylinder" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.35"/>
          <stop offset="25%" stop-color="#081836" stop-opacity="0.85"/>
          <stop offset="75%" stop-color="#081836" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.35"/>
        </linearGradient>

        <linearGradient id="grad-brain-aura" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
          <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.25"/>
        </linearGradient>

        <!-- Arrow Markers -->
        <marker id="arrowhead-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    // Pan & Zoom Engine
    const container = document.getElementById('viewport-container');
    const svg = document.getElementById('architecture-canvas');

    let isPanning = false;
    let startX = 0, startY = 0;
    let translateX = 0, translateY = 0;
    let scale = 1;

    function updateTransform() {
      svg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
      if (e.target.closest('.arch-node') || e.target.closest('.zoom-toolbar') || e.target.closest('.arch-pill')) return;
      isPanning = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(0.45, scale * zoomFactor), 3.5);
      updateTransform();
    }, { passive: false });

    function zoomCanvas(factor) {
      scale = Math.min(Math.max(0.45, scale * factor), 3.5);
      updateTransform();
    }

    function resetCanvas() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    function inspectNode(nodeKey) {
      const data = NODE_DATA[nodeKey];
      if (!data) return;

      const drawer = document.getElementById('node-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      const badge = document.getElementById('drawer-badge');
      const title = document.getElementById('drawer-title');
      const sub = document.getElementById('drawer-sub');
      const body = document.getElementById('drawer-body');

      badge.textContent = data.badge;
      badge.style.color = data.color;
      badge.style.borderColor = data.color;
      badge.style.background = `${data.color}20`;

      title.textContent = data.title;
      sub.textContent = data.sub;
      body.innerHTML = data.content;

      drawer.classList.add('active');
      backdrop.classList.add('active');
    }

    function openHandoverDoc(chapterNum) {
      const doc = HANDOVER_CHAPTERS[chapterNum];
      if (!doc) return;

      const drawer = document.getElementById('node-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      const badge = document.getElementById('drawer-badge');
      const title = document.getElementById('drawer-title');
      const sub = document.getElementById('drawer-sub');
      const body = document.getElementById('drawer-body');

      badge.textContent = doc.badge;
      badge.style.color = doc.color;
      badge.style.borderColor = doc.color;
      badge.style.background = `${doc.color}20`;

      title.textContent = doc.title;
      sub.textContent = doc.sub;
      body.innerHTML = doc.content;

      drawer.classList.add('active');
      backdrop.classList.add('active');
    }

    function closeNodeDrawer() {
      document.getElementById('node-drawer').classList.remove('active');
      document.getElementById('drawer-backdrop').classList.remove('active');
    }

    // Live Search Filtering
    const searchInput = document.getElementById('node-search');
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.arch-node').forEach(node => {
        const text = node.textContent.toLowerCase();
        if (!q || text.includes(q)) {
          node.style.opacity = '1';
          node.querySelector('.node-frame')?.setAttribute('stroke-width', q ? '2.8' : '1.8');
        } else {
          node.style.opacity = '0.2';
          node.querySelector('.node-frame')?.setAttribute('stroke-width', '1.8');
        }
      });
    });
