<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add float: how to pay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:hsl(271,81%,46%)}a:hover{color:hsl(271,81%,38%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: hsl(210, 20%, 98%); font-family: 'DM Sans', 'Plus Jakarta Sans', system-ui, sans-serif; color: hsl(222, 47%, 11%);">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 24px 16px;">
    <div style="height: 260px; border-radius: 16px; background: hsl(0, 0%, 100%); border: 1px solid hsla(220, 13%, 91%, 0.6);"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: hsla(222, 47%, 11%, 0.45);"></div>

  <section role="dialog" aria-label="Add float" style="position: absolute; left: 0; right: 0; bottom: 0; background: hsl(0, 0%, 100%); border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -8px 24px rgba(0,0,0,0.10);">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: hsl(220, 13%, 85%);"></div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700;">Add UGX 1,335,514</h2>
      <p style="margin: 0; font-size: 13.5px; color: hsl(220, 9%, 40%);">Pay Welile with Mobile Money. It lands in your float, then you can join Benjamin.</p>
    </div>

    <div role="radiogroup" aria-label="Mobile Money network" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <button type="button" role="radio" aria-checked="true" style="height: 44px; border-radius: 12px; border: 2px solid hsl(271, 81%, 56%); background: hsla(271, 81%, 56%, 0.06); font-family: inherit; font-weight: 700; font-size: 14px; color: hsl(222, 47%, 11%); cursor: pointer;">MTN MoMo</button>
      <button type="button" role="radio" aria-checked="false" style="height: 44px; border-radius: 12px; border: 1px solid hsl(220, 13%, 91%); background: hsl(0, 0%, 100%); font-family: inherit; font-weight: 600; font-size: 14px; color: hsl(220, 9%, 40%); cursor: pointer;">Airtel Money</button>
    </div>

    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px;">
      <li style="display: flex; gap: 12px; align-items: flex-start;">
        <span aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 9999px; background: hsla(271, 81%, 56%, 0.10); color: hsl(271, 81%, 40%); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">1</span>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 14px; font-weight: 600;">Pay this merchant code</span>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px dashed hsl(271, 60%, 75%); border-radius: 12px; padding: 10px 12px;">
            <div style="display: flex; flex-direction: column;">
              <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 20px; letter-spacing: 0.04em;">090777</span>
              <span style="font-size: 11.5px; color: hsl(220, 9%, 46%);">WELILE TECHNOLOGIES LIMITTED</span>
            </div>
            <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 0; background: hsla(271, 81%, 56%, 0.10); color: hsl(271, 81%, 40%); font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer;">Copy</button>
          </div>
        </div>
      </li>
      <li style="display: flex; gap: 12px; align-items: flex-start;">
        <span aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 9999px; background: hsla(271, 81%, 56%, 0.10); color: hsl(271, 81%, 40%); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">2</span>
        <span style="font-size: 14px; line-height: 1.45;"><strong style="font-weight: 600;">Send UGX 1,335,514</strong><br><span style="color: hsl(220, 9%, 40%); font-size: 13px;">Or more, if you want extra float.</span></span>
      </li>
      <li style="display: flex; gap: 12px; align-items: flex-start;">
        <span aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 9999px; background: hsla(271, 81%, 56%, 0.10); color: hsl(271, 81%, 40%); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">3</span>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
          <label for="tid" style="font-size: 14px; font-weight: 600;">Paste the payment SMS or its Transaction ID</label>
          <input id="tid" type="text" placeholder="e.g. 51234567890" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid hsl(220, 13%, 85%); padding: 0 14px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px; color: hsl(222, 47%, 11%); background: hsl(0, 0%, 100%);">
        </div>
      </li>
    </ol>

    <a href="DepositWaiting.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 16px; background: hsl(271, 81%, 56%); color: hsl(0, 0%, 100%); font-weight: 600; font-size: 15px; text-decoration: none;">I've paid</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>
