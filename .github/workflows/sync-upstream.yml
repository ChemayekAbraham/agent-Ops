name: Auto-Sync Upstream Lovable

on:
  schedule:
    # Run automatically every 30 minutes
    - cron: '*/30 * * * *'
  # Allow manual trigger anytime from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Fetch and Merge Upstream
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          # Configure authenticated origin and ensure branch is at latest origin/main
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git reset --hard HEAD
          git checkout -B main origin/main

          if [ -z "$UPSTREAM_TOKEN" ]; then
            echo "::warning ::UPSTREAM_TOKEN secret is not set yet. Please add a Personal Access Token with repo read permission to repository secrets."
            echo "Using default public/authenticated fetch URL..."
            UPSTREAM_URL="https://github.com/weliletenants-sys/welilereceipts-com-98bba33b.git"
          else
            UPSTREAM_URL="https://x-access-token:${UPSTREAM_TOKEN}@github.com/weliletenants-sys/welilereceipts-com-98bba33b.git"
          fi

          git remote add upstream "$UPSTREAM_URL" || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream lovable

          echo "Attempting auto-merge from upstream/lovable..."
          if git merge upstream/lovable -m "chore(sync): auto-merge updates from lovable" --no-edit; then
            echo "Merge succeeded without conflicts."
          else
            echo "Resolving conflicts by preserving standalone iOS files..."
            git checkout HEAD -- src/App.tsx capacitor.config.ts package.json vite.config.ts index.html .github/ ios/ 2>/dev/null || true
            UNMERGED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            if [ -n "$UNMERGED" ]; then
              echo "Resolving remaining conflicts by keeping local version:"
              echo "$UNMERGED"
              echo "$UNMERGED" | xargs git checkout HEAD -- 2>/dev/null || true
            fi
            git add .
            git commit -m "chore(sync): resolve conflicts preserving iOS standalone configuration" || true
          fi

          # Push to origin with retry in case remote main moved
          MAX_RETRIES=3
          RETRY=0
          PUSHED=false
          while [ $RETRY -lt $MAX_RETRIES ]; do
            if git push origin main; then
              PUSHED=true
              break
            fi
            echo "Push rejected (non-fast-forward). Fetching latest origin/main and merging before retrying..."
            RETRY=$((RETRY + 1))
            git fetch origin main
            git merge origin/main -m "chore(sync): merge latest origin/main" --no-edit || {
              RETRY_UNMERGED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$RETRY_UNMERGED" ]; then
                echo "$RETRY_UNMERGED" | xargs git checkout HEAD -- 2>/dev/null || true
              fi
              git add .
              git commit -m "chore(sync): resolve conflicts with origin/main" || true
            }
          done

          if [ "$PUSHED" = false ]; then
            echo "::error::Failed to push changes to origin/main after $MAX_RETRIES attempts."
            exit 1
          fi

          echo "Sync completed successfully."
