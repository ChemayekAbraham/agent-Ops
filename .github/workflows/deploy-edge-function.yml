name: Deploy Edge Function (manual, one at a time)

# PREPARED, NEVER RUN. Deploys nothing until a maintainer triggers it by hand.
#
# WHY MANUAL-ONLY, AND WHY ONE FUNCTION PER RUN
# The repository contains 333 Edge Functions. A bare `supabase functions deploy`
# with no argument deploys ALL of them, and repository state is already known to
# differ from deployed state (approve-deposit ran defective code for a day while
# the revert sat in git). An automatic or bulk deploy would push 332 unrelated,
# unreviewed functions to production in one action.
#
# So this workflow:
#   * has NO push / pull_request trigger - workflow_dispatch only
#   * deploys exactly ONE function, chosen from a fixed list
#   * cannot be pointed at an arbitrary function name (choice input, not string)
#
# sms-otp added 2026-09-17: production was running a stale build that polls
# Yoola's delivery-report API and treats "not yet confirmed delivered" as a
# failure before falling over to Africa's Talking/LANA. Since no provider has
# ever populated a real delivered status (see docs/HANDOVER/56), that wait
# never succeeds, and ~95% of OTP sends were failing. The checked-in version
# only requires gateway acceptance and has no such wait.
#
# ORDERING REQUIREMENT (accounting, not convenience)
# Applies to the two money functions ONLY:
# fund-agent-landlord-float MUST be deployed and verified BEFORE tenant-pay-rent.
# The repayment waterfall DEBITS L7, and funding recognition is what CREDITS it.
# Deploying the repayment side first would let a repayment drive L7 into an
# unexplained debit. The guard enforces this at runtime, but the deploy order
# should not rely on an exception being raised in production.
#
# PREREQUISITE
# Migrations 20260908120500 / 20260908130000 / 20260908140000 must be applied
# first. Deploying tenant-pay-rent before them would call
# record_rent_request_repayment_v2, which would not yet exist.
#
# REQUIRED REPOSITORY SECRET (set in GitHub, never in this file or in git)
#   SUPABASE_ACCESS_TOKEN - a Supabase personal access token with permission to
#   deploy functions to project wirntoujqoyjobfhyelc.
# The project ref is NOT a secret; it is already committed in supabase/config.toml.

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Which function to deploy"
        required: true
        type: choice
        options:
          - fund-agent-landlord-float
          - tenant-pay-rent
          - verify-passport-photo
          - read-national-id
          - proxy-promissory-note-reminders
          - agent-daily-performance-report
          - agent-ops-daily-report
          - notify-agent-collection-lapse
          - redispatch-withdrawals
          - sms-otp
          - daily-cto-report
          - notify-landlord-payout-rejected
          - send-landlord-payout-resubmit-sms
          - national-id-link-otp
          - password-reset-sms
          - issue-wallet-withdrawal-otp
      confirm:
        description: 'Type DEPLOY to confirm you intend to change production'
        required: true
        type: string

concurrency:
  group: deploy-edge-function
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.function }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm intent
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmation text did not match. Nothing deployed."
            exit 1
          fi
          echo "Deploying exactly one function: ${{ inputs.function }}"

      - uses: actions/checkout@v4

      - name: Verify the target function exists in this commit
        run: |
          set -euo pipefail
          test -f "supabase/functions/${{ inputs.function }}/index.ts" \
            || { echo "::error::function source not found"; exit 1; }
          echo "Source present at supabase/functions/${{ inputs.function }}/index.ts"

      - name: Confirm verify_jwt posture is what we expect for THIS function
        run: |
          set -euo pipefail
          # config.toml lists only functions that need verify_jwt = false, so the
          # ABSENCE of an entry means the default (true) applies.
          #
          # The original check refused any function carrying an entry at all.
          # That was right for the two money functions, which authenticate via
          # the Authorization header and must stay on the default - but 73 of the
          # 333 functions legitimately carry an entry, and the cron-invoked
          # reports are among them: nothing presents a user JWT at 03:00, so they
          # would fail every run with verify_jwt = true. A blanket refusal made
          # those undeployable.
          #
          # So the posture is declared per function and asserted, rather than
          # assumed. Either direction being wrong stops the deploy: an unexpected
          # entry appearing on a JWT function, or a public function quietly
          # losing the entry that keeps its scheduler able to call it.
          case "${{ inputs.function }}" in
            agent-daily-performance-report|agent-ops-daily-report|redispatch-withdrawals|daily-cto-report)
              EXPECT_PUBLIC=yes ;;   # invoked by pg_cron, no user JWT exists
            sms-otp|password-reset-sms)
              EXPECT_PUBLIC=yes ;;   # called pre-signup/pre-login, no user session exists yet
            *)
              EXPECT_PUBLIC=no ;;    # authenticates via the Authorization header
          esac

          if grep -q "\[functions.${{ inputs.function }}\]" supabase/config.toml; then
            HAS_ENTRY=yes
          else
            HAS_ENTRY=no
          fi

          if [ "$EXPECT_PUBLIC" = "yes" ]; then
            if [ "$HAS_ENTRY" != "yes" ]; then
              echo "::error::${{ inputs.function }} is scheduler-invoked and needs verify_jwt = false, but config.toml has no entry. A cron call would 401 on every run."
              exit 1
            fi
            if ! grep -A2 "\[functions.${{ inputs.function }}\]" supabase/config.toml | grep -q "verify_jwt = false"; then
              echo "::error::${{ inputs.function }} has a config.toml entry that is not verify_jwt = false - review before deploying"
              exit 1
            fi
            echo "Expected posture confirmed: verify_jwt = false (scheduler-invoked)."
          else
            if [ "$HAS_ENTRY" = "yes" ]; then
              echo "::error::${{ inputs.function }} now has an explicit config.toml entry - review verify_jwt before deploying"
              exit 1
            fi
            echo "No explicit entry: default verify_jwt = true preserved."
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy single function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not configured"
            exit 1
          fi
          PROJECT_REF="$(grep -m1 '^project_id' supabase/config.toml | cut -d'"' -f2)"
          echo "Target project: ${PROJECT_REF}"
          supabase functions deploy "${{ inputs.function }}" --project-ref "${PROJECT_REF}"

      - name: Post-deploy reminder
        run: |
          echo "Deployed: ${{ inputs.function }}"
          case "${{ inputs.function }}" in
            verify-passport-photo|read-national-id)
              echo "Identity function - moves no money, not part of the fund-then-repay ordering."
              echo "Check: a photo check still returns a verdict, and the withdraw dialog"
              echo "prefills the six National ID fields."
              ;;
            daily-cto-report)
              echo "Reporting function - moves no money. Invoked by pg_cron jobs"
              echo "daily-cto-report-tech and weekly-cto-report-board (net.http_post, apikey only)."
              echo "Check: next scheduled run delivers, and median/p95 sign-in fields are populated"
              echo "once migration 20260918040000 has been applied to production."
              ;;
            *)
              echo "NEXT: verify against the live ledger before deploying anything else."
              echo "Do NOT deploy tenant-pay-rent until fund-agent-landlord-float is verified."
              ;;
          esac
